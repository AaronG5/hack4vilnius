[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaron Gandžumian" },
    { name = "Augustas Rinkevičius" },
    { name = "Augustė Tumaitė" },
    { name = "Lukas Stavaris", email = "lukas.stavaris@gmail.com" },
    { name = "Marius Kuprys" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "google-auth[requests]>=2.61.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.5",
  "django-stubs>=6.1.2",
  "djangorestframework-stubs>=3.18.1",
  "pytest>=9.0.3",
  "pytest-django>=4.14.0",
  "pyyaml>=6.0.3",
  "ruff>=0.15.13",
  "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
backend = "backend:main"

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
DJANGO_SETTINGS_MODULE = "vilnius_backend.settings"
testpaths = ["src/backend"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "recommended"
extraPaths = ["src/backend"]

[tool.ruff]
target-version = "py313"
output-format = "full"
lint.select = [
  # https://beta.ruff.rs/docs/rules
  "A",     # flake8-builtins
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "C90",   # McCabe cyclomatic complexity
  "DJ",    # flake8-django
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "F",     # Pyflakes
  "FA",    # flake8-future-annotations
  "FLY",   # flynt
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "INP",   # flake8-no-pep420
  "INT",   # flake8-gettext
  "ISC",   # flake8-implicit-str-concat
  "N",     # pep8-naming
  "NPY",   # NumPy-specific rules
  "PD",    # pandas-vet
  "PGH",   # pygrep-hooks
  "PIE",   # flake8-pie
  "PL",    # Pylint
  "PT",    # flake8-pytest-style
  "PYI",   # flake8-pyi
  "RSE",   # flake8-raise
  "RUF",   # Ruff-specific rules
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "T10",   # flake8-debugger
  "TD",    # flake8-todos
  "TID",   # flake8-tidy-imports
  "UP",    # pyupgrade
  "W",     # pycodestyle
  "ANN",   # flake8-annotations
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "ERA",   # eradicate
  "FBT",   # flake8-boolean-trap
  "PTH",   # flake8-use-pathlib
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "TCH",   # flake8-type-checking
  "TRY",   # tryceratops "YTT",
]
lint.ignore = [
  "COM812",
  "D107",
  "D203",
  "D205",
  "D212",
  "S101",    # Use of `assert` detected -- DO NOT FIX
  "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
  "SIM300",  # Yoda conditions
]

[tool.ruff.lint.per-file-ignores]
# manage.py defers the Django import deliberately, to raise a friendly
# ImportError if Django isn't installed before anything else runs.
"src/backend/manage.py" = ["PLC0415"]
